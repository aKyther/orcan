# ttyd overlay for make terminal and make terminal-docker.
# Remote access: browser only (ttyd → workspace picker → tmux). No SSH server.
# Recommended: Tailscale (or localhost). Do not expose port 7681 on the public Internet.
services:
  orcan:
    command: ["cursor-ttyd"]
    restart: unless-stopped
    ports:
      - "${TTYD_HOST_PORT:-7681}:7681"
    environment:
      TTYD_PORT: ${TTYD_PORT:-7681}
      TTYD_FONT_SIZE: ${TTYD_FONT_SIZE:-22}
      TTYD_FONT_FAMILY: ${TTYD_FONT_FAMILY:-}
      TTYD_THEME: ${TTYD_THEME:-dark}
      PROJECT_DIR: ${PROJECT_DIR}
      CONTAINER_PROJECT_DIR: ${CONTAINER_PROJECT_DIR:-${PROJECT_DIR}}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-}
      WORKSPACE_META_PATH: ${WORKSPACE_META_PATH:-}
      ORCAN_CONFIG: ${ORCAN_CONFIG:-/etc/orcan/config.json}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:7681/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
