# ttyd overlay for `orcan up --with-ttyd`.
# Remote access: browser only (ttyd → workspace picker → tmux). No SSH server.
# Supervisord runs ttyd as the browser-facing service.
# Default: all interfaces (TTYD_BIND=0.0.0.0). For local-only publish:
# TTYD_BIND=127.0.0.1. Do not expose this port to the public Internet
# without auth (TTYD_CREDENTIAL / --with-ttyd-auth) and TLS.
services:
  orcan:
    command: ["orcan-supervisord"]
    restart: unless-stopped
    ports:
      - "${TTYD_BIND:-0.0.0.0}:${TTYD_HOST_PORT:-7681}:7681"
    environment:
      ORCAN_SUPERVISOR_MODE: ttyd
      TTYD_PORT: ${TTYD_PORT:-7681}
      TTYD_FONT_SIZE: ${TTYD_FONT_SIZE:-14}
      TTYD_FONT_FAMILY: ${TTYD_FONT_FAMILY:-}
      TTYD_THEME: ${TTYD_THEME:-dark}
      TTYD_PING_INTERVAL: ${TTYD_PING_INTERVAL:-20}
      # Optional HTTP basic auth (user:password). Empty = no auth.
      TTYD_CREDENTIAL: ${TTYD_CREDENTIAL:-}
      PROJECT_DIR: ${PROJECT_DIR}
      CONTAINER_PROJECT_DIR: ${CONTAINER_PROJECT_DIR:-${PROJECT_DIR}}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-}
      WORKSPACE_META_PATH: ${WORKSPACE_META_PATH:-}
      ORCAN_CONFIG: ${ORCAN_CONFIG:-/etc/orcan/config.json}
    # Inside the container: $$ → $. Unauthenticated curl gets 401 when
    # TTYD_CREDENTIAL is set (--with-ttyd-auth or .env).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$TTYD_CREDENTIAL\" ]; then curl --fail --silent -u \"$$TTYD_CREDENTIAL\" http://127.0.0.1:7681/; else curl --fail --silent http://127.0.0.1:7681/; fi >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
