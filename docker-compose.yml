services:
  cind:
    build:
      context: .
      args:
        USERNAME: developer
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        DOCKER_GID: ${DOCKER_GID:-999}
    image: cind:latest
    hostname: cind
    working_dir: ${CONTAINER_PROJECT_DIR:-${PROJECT_DIR}}
    stdin_open: true
    tty: true
    init: true
    cpus: ${CPUS:-8}
    mem_limit: ${MEMORY:-16g}
    shm_size: ${SHM_SIZE:-2g}
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
      HISTFILE: /command-history/.bash_history
      PNPM_HOME: /home/developer/.local/share/pnpm
      UV_CACHE_DIR: /home/developer/.cache/uv
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      PROJECT_DIR: ${PROJECT_DIR}
      CONTAINER_PROJECT_DIR: ${CONTAINER_PROJECT_DIR:-${PROJECT_DIR}}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-}
      WORKSPACE_META_PATH: ${WORKSPACE_META_PATH:-}
      CIND_CONFIG: ${CIND_CONFIG:-/etc/cind/config.json}
      CIND_DATA: ${CIND_DATA}
    volumes:
      - ${CIND_CONFIG_HOST:-./.cind/runtime-config.json}:/etc/cind/config.json:ro
      - ${CIND_DATA}/cursor:/home/developer/.cursor
      - ${CIND_DATA}/cursor-app:/home/developer/.config/cursor
      - ${CIND_DATA}/claude:/home/developer/.claude
      - ${CIND_DATA}/cache:/home/developer/.cache
      - ${CIND_DATA}/npm:/home/developer/.npm
      - ${CIND_DATA}/pnpm:/home/developer/.local/share/pnpm
      - ${CIND_DATA}/cargo:/home/developer/.cargo
      - ${CIND_DATA}/go:/home/developer/go
      - ${CIND_DATA}/bash-history:/command-history
    tmpfs:
      - /tmp:size=${TMPFS_SIZE:-2g},mode=1777
