# Fixed Compose project name (avoids folder-based names like cind-orcan-1).
# Container shows as orcan-1 (set ORCAN_INSTANCE=2 for orcan-2, etc.).
name: orcan

services:
  orcan:
    image: ${IMAGE_LOCAL:-orcan:latest}
    container_name: orcan-${ORCAN_INSTANCE:-1}
    hostname: orcan
    working_dir: ${CONTAINER_PROJECT_DIR:-${PROJECT_DIR}}
    stdin_open: true
    tty: true
    init: true
    cpus: ${CPUS:-2}
    mem_limit: ${MEMORY:-4g}
    shm_size: ${SHM_SIZE:-512m}
    # High file-descriptor / process ceilings. supervisord aborts on start
    # when its soft RLIMIT_NOFILE is under minfds (1024) and it cannot
    # raise it; ttyd + tmux + node/uv tooling under it also burn FDs fast.
    # Override via ULIMIT_NOFILE / ULIMIT_NPROC in .env if needed.
    ulimits:
      nofile:
        soft: ${ULIMIT_NOFILE:-1048576}
        hard: ${ULIMIT_NOFILE:-1048576}
      nproc:
        soft: ${ULIMIT_NPROC:-65536}
        hard: ${ULIMIT_NPROC:-65536}
    build:
      context: .
      args:
        USERNAME: developer
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        DOCKER_GID: ${DOCKER_GID:-999}
        INSTALL_CURSOR: ${INSTALL_CURSOR:-1}
        INSTALL_CLAUDE: ${INSTALL_CLAUDE:-1}
        INSTALL_CODEX: ${INSTALL_CODEX:-1}
        INSTALL_GEMINI: ${INSTALL_GEMINI:-1}
        INSTALL_COPILOT: ${INSTALL_COPILOT:-1}
        ORCAN_VERSION: ${ORCAN_VERSION:-dev}
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
      # Shell history under $HOME (host: $ORCAN_DATA/history)
      HISTFILE: /home/developer/.local/share/orcan/history/.zsh_history
      # Tool caches all nest under ~/.cache (host: $ORCAN_DATA/cache) — one bind.
      XDG_CACHE_HOME: /home/developer/.cache
      npm_config_cache: /home/developer/.cache/npm
      PNPM_HOME: /home/developer/.cache/pnpm
      CARGO_HOME: /home/developer/.cache/cargo
      GOPATH: /home/developer/.cache/go
      GOCACHE: /home/developer/.cache/go-build
      GOMODCACHE: /home/developer/.cache/go/pkg/mod
      UV_CACHE_DIR: /home/developer/.cache/uv
      RUFF_CACHE_DIR: /home/developer/.cache/ruff
      MYPY_CACHE_DIR: /home/developer/.cache/mypy
      PIP_CACHE_DIR: /home/developer/.cache/pip
      PRE_COMMIT_HOME: /home/developer/.cache/pre-commit
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      CLAUDE_CONFIG_DIR: /home/developer/.claude
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      PROJECT_DIR: ${PROJECT_DIR}
      CONTAINER_PROJECT_DIR: ${CONTAINER_PROJECT_DIR:-${PROJECT_DIR}}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-}
      WORKSPACE_META_PATH: ${WORKSPACE_META_PATH:-}
      ORCAN_CONFIG: ${ORCAN_CONFIG:-/etc/orcan/config.json}
      ORCAN_DATA: ${ORCAN_DATA}
      ORCAN_PROJECTS_ROOT: ${ORCAN_PROJECTS_ROOT}
      TZ: ${TZ:-UTC}
      # Host git identity (orcan sync → .env). Same author/committer as host commits.
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-${GIT_AUTHOR_NAME:-}}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-${GIT_AUTHOR_EMAIL:-}}
    volumes:
      - ${ORCAN_CONFIG_HOST:-./mounts/runtime-config.json}:/etc/orcan/config.json:ro
      - /etc/localtime:/etc/localtime:ro
      # Stable managed-project root — host path == container path (path
      # parity), mounted once. Projects/worktrees living under it become
      # visible in a running container without a new bind mount, so adding
      # or removing one never forces a recreate. See apply-config.py
      # (managed_projects_root / write_compose_projects) and
      # docs/en/ideas/mental-model.md.
      # Falls back to ORCAN_DATA's own default (paths.sh) rather than an
      # empty string — an unset/empty source here is an invalid Docker
      # mount, which would break `docker compose` for anyone invoking it
      # directly (e.g. tests/integration/test-path-parity.sh) before
      # `orcan sync` has ever written .env.
      - ${ORCAN_PROJECTS_ROOT:-${HOME}/.config/orcan/sandbox}:${ORCAN_PROJECTS_ROOT:-${HOME}/.config/orcan/sandbox}
      - ${ORCAN_DATA}/cursor:/home/developer/.cursor
      - ${ORCAN_DATA}/cursor-app:/home/developer/.config/cursor
      - ${ORCAN_DATA}/claude:/home/developer/.claude
      - ${ORCAN_DATA}/codex:/home/developer/.codex
      - ${ORCAN_DATA}/gemini:/home/developer/.gemini
      - ${ORCAN_DATA}/copilot:/home/developer/.copilot
      # Single cache bind — npm/pnpm/cargo/go live under ~/.cache via env (see above).
      - ${ORCAN_DATA}/cache:/home/developer/.cache
      - ${ORCAN_DATA}/history:/home/developer/.local/share/orcan/history
      - ${ORCAN_DATA}/dotfiles:/home/developer/.config/orcan/dotfiles
    tmpfs:
      - /tmp:size=${TMPFS_SIZE:-512m},mode=1777
