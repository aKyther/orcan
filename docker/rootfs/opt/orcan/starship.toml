# Default Starship config for orcan (missing-only copy to ~/.config/starship.toml).
# Two-line, low-noise prompt. Palette matches Warm Graphite / Amber.

format = """
$directory\
[  ](#292420)\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[›](#e8b76c)"
error_symbol = "[›](#e06c75)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "#f0e9e0"
read_only = " ro"
read_only_style = "#e5c07b"

[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "#e8b76c"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "#e5c07b"
conflicted = "!"
ahead = "↑"
behind = "↓"
diverged = "↕"
untracked = "?"
stashed = "$"
modified = "*"
staged = "+"
renamed = "r"
deleted = "x"

# Only show when a command took noticeable time (dev feedback, low noise).
[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "#9a8f80"
