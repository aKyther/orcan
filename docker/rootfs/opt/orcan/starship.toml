# Default Starship config for orcan (missing-only copy to ~/.config/starship.toml).
# Two-line, low-noise prompt. Palette matches the graphite/plum tmux chrome.

format = """
$directory\
[  ](#554e61)\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[›](#9b87b8)"
error_symbol = "[›](#d98282)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "#b9b3c2"
read_only = " ro"
read_only_style = "#fbbf24"

[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "#aa9bc2"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "#c9a86a"
conflicted = "!"
ahead = "↑"
behind = "↓"
diverged = "↕"
untracked = "?"
stashed = "$"
modified = "*"
staged = "+"
renamed = "r"
deleted = "x"

# Only show when a command took noticeable time (dev feedback, low noise).
[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "#756f82"
