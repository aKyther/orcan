# Default lazygit config for orcan (missing-only copy to ~/.config/lazygit/config.yml).
# Theme matches the orcan terminal palette (dark navy / subtle cyan) — see
# docs/en/guides/terminal-ui.md when changing colours.

gui:
  theme:
    activeBorderColor:
      - "#5eead4"
      - bold
    inactiveBorderColor:
      - "#1e293b"
    searchingActiveBorderColor:
      - "#fbbf24"
      - bold
    optionsTextColor:
      - "#67e8f9"
    selectedLineBgColor:
      - "#152033"
    inactiveViewSelectedLineBgColor:
      - "#111827"
    cherryPickedCommitFgColor:
      - "#0a0e17"
    cherryPickedCommitBgColor:
      - "#5eead4"
    markedBaseCommitFgColor:
      - "#0a0e17"
    markedBaseCommitBgColor:
      - "#fbbf24"
    unstagedChangesColor:
      - "#f87171"
    defaultFgColor:
      - "#c8d3e0"

git:
  paging:
    # Reuse git's own pager (delta, set in /opt/orcan/gitconfig) instead of
    # respecifying delta flags here — one place to change, can't drift.
    useConfig: true

update:
  # lazygit's version is pinned by the orcan image (LAZYGIT_VERSION in the
  # Dockerfile) — an in-app update would just be overwritten on next rebuild.
  method: never

disableStartupPopups: true
