# Default lazygit config for orcan (missing-only copy to ~/.config/lazygit/config.yml).
# Theme matches the restrained graphite/plum terminal palette — see
# docs/en/guides/terminal-ui.md when changing colours.

gui:
  theme:
    activeBorderColor:
      - "#9b87b8"
    inactiveBorderColor:
      - "#4a3d59"
    searchingActiveBorderColor:
      - "#c9a86a"
    optionsTextColor:
      - "#aa9bc2"
    selectedLineBgColor:
      - "#2a2235"
    inactiveViewSelectedLineBgColor:
      - "#211b29"
    cherryPickedCommitFgColor:
      - "#0e0c13"
    cherryPickedCommitBgColor:
      - "#9b87b8"
    markedBaseCommitFgColor:
      - "#0e0c13"
    markedBaseCommitBgColor:
      - "#c9a86a"
    unstagedChangesColor:
      - "#d98282"
    defaultFgColor:
      - "#d8d2e2"

git:
  paging:
    # Reuse git's own pager (delta, set in /opt/orcan/gitconfig) instead of
    # respecifying delta flags here — one place to change, can't drift.
    useConfig: true

update:
  # lazygit's version is pinned by the orcan image (LAZYGIT_VERSION in the
  # Dockerfile) — an in-app update would just be overwritten on next rebuild.
  method: never

disableStartupPopups: true
