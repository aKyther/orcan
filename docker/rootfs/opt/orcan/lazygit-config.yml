# Default lazygit config for orcan (missing-only copy to ~/.config/lazygit/config.yml).
# Theme matches the Warm Graphite / Amber terminal palette — see
# docs/en/guides/terminal-ui.md when changing colours.

gui:
  theme:
    activeBorderColor:
      - "#e8b76c"
    inactiveBorderColor:
      - "#332e28"
    searchingActiveBorderColor:
      - "#e5c07b"
    optionsTextColor:
      - "#e8b76c"
    selectedLineBgColor:
      - "#2a251f"
    inactiveViewSelectedLineBgColor:
      - "#201d19"
    cherryPickedCommitFgColor:
      - "#171512"
    cherryPickedCommitBgColor:
      - "#e8b76c"
    markedBaseCommitFgColor:
      - "#171512"
    markedBaseCommitBgColor:
      - "#e5c07b"
    unstagedChangesColor:
      - "#e06c75"
    defaultFgColor:
      - "#f0e9e0"

git:
  paging:
    # Reuse git's own pager (delta, set in /opt/orcan/gitconfig) instead of
    # respecifying delta flags here — one place to change, can't drift.
    useConfig: true

update:
  # lazygit's version is pinned by the orcan image (LAZYGIT_VERSION in the
  # Dockerfile) — an in-app update would just be overwritten on next rebuild.
  method: never

disableStartupPopups: true
