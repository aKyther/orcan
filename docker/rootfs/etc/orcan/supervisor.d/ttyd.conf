; Browser terminal (orcan up --with-ttyd).
[program:ttyd]
command=cursor-ttyd
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=ttyd.out.log
stderr_logfile=ttyd.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile_backups=3
redirect_stderr=false
priority=100
