[program:cache-maintenance]
command=python3 /usr/local/lib/orcan/cache_maintenance.py
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=cache-maintenance.out.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=cache-maintenance.err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1
priority=50
