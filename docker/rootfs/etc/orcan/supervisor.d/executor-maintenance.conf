[program:executor-maintenance]
command=orcan-executor maintenance
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=executor-maintenance.out.log
stderr_logfile=executor-maintenance.err.log
stdout_logfile_maxbytes=2MB
stderr_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile_backups=1
priority=40
