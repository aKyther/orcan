[program:executor-redis]
command=orcan-executor-redis
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=executor-redis.out.log
stderr_logfile=executor-redis.err.log
stdout_logfile_maxbytes=2MB
stderr_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile_backups=1
priority=10
