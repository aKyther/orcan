[program:executor-worker-4]
command=orcan-executor worker --slot 4
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=executor-worker-4.out.log
stderr_logfile=executor-worker-4.err.log
stdout_logfile_maxbytes=2MB
stderr_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile_backups=1
priority=20
