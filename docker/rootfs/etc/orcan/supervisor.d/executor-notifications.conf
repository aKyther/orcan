[program:executor-notifications]
command=orcan-executor notification-controller
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=executor-notifications.out.log
stderr_logfile=executor-notifications.err.log
stdout_logfile_maxbytes=2MB
stderr_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile_backups=1
priority=40
