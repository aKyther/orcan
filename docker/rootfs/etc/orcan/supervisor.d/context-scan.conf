; Filesystem Reflection scanner (Claude + Cursor transcripts → inbox).
; Disable with ORCAN_CONTEXT_SCAN=0.
[program:context-scan]
command=orcan-context-scan --all-workspaces --watch --interval 60
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=context-scan.out.log
stderr_logfile=context-scan.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile_backups=3
redirect_stderr=false
priority=200
