[program:executor-web]
command=orcan-executor web --host 0.0.0.0 --port 8765
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=executor-web.out.log
stderr_logfile=executor-web.err.log
stdout_logfile_maxbytes=2MB
stderr_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile_backups=1
priority=30
