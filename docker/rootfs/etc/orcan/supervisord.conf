; Orcan process supervisor — runtime copy is rendered by orcan-supervisord
; with concrete log paths under ~/.local/share/orcan/history/supervisor/
; (bind-mounted from $ORCAN_DATA/history — survives container recreate).
;
; Runs as container user ``developer`` (image USER / Compose). Do not set
; program ``user=`` here: supervisord is already non-root, so children inherit
; developer. orcan-supervisord refuses to start as root.

[unix_http_server]
file=%(here)s/supervisor.sock
chmod=0700
username=orcan
password=orcan

[supervisord]
nodaemon=true
logfile=%(here)s/supervisord.log
pidfile=%(here)s/supervisord.pid
childlogdir=%(here)s/childlog
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/supervisor.sock
username=orcan
password=orcan

[include]
files = %(here)s/programs/*.conf
