# orcan tmux — image defaults under /etc/tmux/.
# Personal overrides: ~/.config/orcan/dotfiles/tmux.conf.local
# (host: $ORCAN_DATA/dotfiles/tmux.conf.local)

source-file /etc/tmux/tmux.conf
if-shell '[ -f ~/.config/orcan/dotfiles/tmux.conf.local ]' {
    source-file ~/.config/orcan/dotfiles/tmux.conf.local
}
