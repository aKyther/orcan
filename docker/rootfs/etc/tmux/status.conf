# Status bar — one row at bottom (tmux 3.2+): window tabs, centred.
#
# The identity+metrics row (workspace brief/AI usage/git branch/battery via
# status-left.sh/status-right.sh) that used to live here is gone: the
# cockpit's own top bar (rail icons + CPU/RAM/clock) and bottom bar
# (workspace/branch/tmux session/pending) now own that — showing it a
# second time in tmux's own status line would just be redundant chrome and
# a wasted row of real pane space. status-left.sh/status-right.sh/
# ai-usage.sh stay on disk (still directly tested — see
# tests/smoke/test-container.sh) even though nothing in tmux's own config
# invokes them anymore; a raw `tmux attach`/`orcan enter --tmux` user
# outside the cockpit will not see that info at all, a deliberate tradeoff.
#
# Palette: graphite / near-black / muted plum (truecolor; ttyd + desktop).
# Image ships tmux 3.6a; gated blocks keep reloads safe on older servers.

# "on" not "1": tmux's `status` option only accepts a bare numeric literal
# on a *fresh* load — `source-file`-ing "status 1" onto an already-running
# session (prefix r's live reload) fails with "unknown value: 1", even
# though "1" and "on" resolve to the exact same thing. "on" works both ways.
set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-interval 5

set -g status-style 'bg=#1b1724,fg=#948ba3'

# Centred window tabs.
set -g status-format[0] '#[bg=#1b1724,list=on align=centre]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_bell_flag},#{!=:#{window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#{T:window-status-format}#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_bell_flag},#{!=:#{window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#{T:window-status-current-format}#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}'

# Tabs — quiet text; the current window gets a soft plum surface, not a badge.
setw -g window-status-style 'fg=#948ba3,bg=#1b1724'
setw -g window-status-format '#[fg=#746a82,bg=#1b1724]#I #[fg=#948ba3]#W'
setw -g window-status-current-style 'fg=#e2ddea,bg=#2a2237'
setw -g window-status-current-format '#[fg=#ad91d0,bg=#2a2237]#I #[fg=#e2ddea]#W'
setw -g window-status-separator '#[bg=#1b1724]   '
setw -g window-status-activity-style 'fg=#c9a86a,bg=#1b1724'
setw -g window-status-bell-style 'fg=#d98282,bg=#1b1724'

# Active pane pops; inactive sinks (soft gap feel with spaces borders).
set -g window-style 'fg=#948ba3,bg=#0d0b13'
set -g window-active-style 'fg=#e2ddea,bg=#12101a'

# Pane title strip on top: which pane is active, its live label, its cwd —
# genuinely pane-specific info with no cockpit equivalent. clock + cpu/mem
# used to live here too (right-aligned, via scripts/pane-border-right.sh)
# but that's exactly the system-level info the cockpit's own top bar now
# owns — dropped here rather than shown twice. pane-border-right.sh stays
# on disk (still required/shellchecked — see scripts/repository/validate.sh)
# even though this format string no longer calls it.
#
# Window tabs: native #{pane_current_command} — cheap and fired often (every
# child process an agent spawns triggers the rename check).
setw -g automatic-rename-format '#{pane_current_command}'
# Pane border strip: pane-label.sh resolves "node" → "claude" via /proc, but
# gets command + pid from native format vars so it never calls back into
# `tmux` (that shell-out per redraw lagged input in busy agent panes).
set -g pane-border-status top
set -g pane-border-format ' #[fg=#{?pane_active,#ad91d0,#746a82}]#{?pane_active,› ,  }#[fg=#{?pane_active,#b9abd2,#948ba3}]#(/etc/tmux/scripts/pane-label.sh #{pane_current_command} #{pane_pid}) #[fg=#746a82]· #[fg=#{?pane_active,#b0a6ba,#746a82}]#{b:pane_current_path} '
set -g pane-border-style 'fg=#211c2b,bg=#0d0b13'
set -g pane-active-border-style 'fg=#604e72,bg=#12101a'
set -g pane-border-indicators both

%if #{>=:#{version},3.6}
setw -g pane-border-lines spaces
%else
setw -g pane-border-lines heavy
%endif

%if #{>=:#{version},3.5}
setw -g pane-scrollbars modal
setw -g pane-scrollbars-position right
setw -g pane-scrollbars-style 'bg=#1b1724,fg=#948ba3,width=1,pad=0'
%endif

# Menus / popups (session picker, URL pick) — need tmux 3.4+ style options.
%if #{>=:#{version},3.4}
set -g menu-style 'bg=#211c2b,fg=#cbc4d3'
set -g menu-selected-style 'bg=#342a44,fg=#e2ddea'
set -g menu-border-style 'fg=#604e72,bg=#211c2b'
set -g popup-style 'bg=#211c2b,fg=#cbc4d3'
set -g popup-border-style 'fg=#604e72,bg=#211c2b'
set -g popup-border-lines rounded
%endif

# Message / command / copy / clock
set -g message-style 'bg=#342a44,fg=#e2ddea'
set -g message-command-style 'bg=#c9a86a,fg=#12101a'
set -g mode-style 'bg=#342a44,fg=#e2ddea'
set -g copy-mode-match-style 'bg=#423452,fg=#e2ddea'
set -g copy-mode-current-match-style 'bg=#ad91d0,fg=#12101a'
set -g display-panes-colour '#746a82'
set -g display-panes-active-colour '#ad91d0'
set -g clock-mode-colour '#ad91d0'
set -g clock-mode-style 24
