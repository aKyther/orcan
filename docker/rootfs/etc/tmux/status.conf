# Status bar — minimal dashboard (scripts must stay lightweight for ttyd)

set -g status-position bottom
set -g status-justify left
set -g status-bg colour234
set -g status-fg colour250

# Prefix indicator: ◉ when prefix active
set -g status-left-length 60
set -g status-left '#( /etc/tmux/scripts/status-left.sh )'

set -g status-right-length 120
set -g status-right '#( /etc/tmux/scripts/status-right.sh )'

setw -g window-status-format ' #{?window_active,#[fg=colour231,bold],#[fg=colour245]}#I #{window_name} '
setw -g window-status-current-format ' #[fg=colour234,bg=colour81,bold] #I #{window_name} '

setw -g window-status-separator ''
