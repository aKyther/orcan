# Status bar — colourful dashboard (scripts stay lightweight for ttyd).
# Keybindings unchanged — see keybindings.conf (local Alt/Ctrl binds).

set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-style 'bg=colour234,fg=colour252,bold'
set -g status-left-length 80
set -g status-right-length 160

set -g status-left '#( /etc/tmux/scripts/status-left.sh )'
set -g status-right '#( /etc/tmux/scripts/status-right.sh )'

# Window tabs — high contrast for phone / browser
setw -g window-status-style 'fg=colour245,bg=colour234'
setw -g window-status-format ' #[fg=colour240]#I#[fg=colour245] #{window_name} '
setw -g window-status-current-style 'fg=colour232,bg=colour81,bold'
setw -g window-status-current-format ' #[fg=colour232,bg=colour81,bold] #I #{window_name} '
setw -g window-status-separator '#[fg=colour236]│'

# Active pane border (subtle highlight)
setw -g pane-active-border-style 'fg=colour81,bg=colour234'
setw -g pane-border-style 'fg=colour236,bg=colour234'

# Message / command line
set -g message-style 'bg=colour81,fg=colour232,bold'
set -g message-command-style 'bg=colour208,fg=colour232,bold'
