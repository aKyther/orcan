# Status bar — IDE-like chrome for ttyd (top tabs + per-pane bottom headers).
# Keep #(scripts) only on the global status line — never in pane-border-format.

set -g status-position top
set -g status-justify centre
set -g status-interval 5

set -g status-style 'bg=colour234,fg=colour252'
set -g status-left-length 36
set -g status-right-length 48

set -g status-left '#( /etc/tmux/scripts/status-left.sh )'
set -g status-right '#( /etc/tmux/scripts/status-right.sh )'

# Window list = tabs (centre). Plain ASCII — no Nerd Font / emoji required.
setw -g window-status-style 'fg=colour245,bg=colour234'
setw -g window-status-format '#[fg=colour240] #I#[fg=colour245]:#W '
setw -g window-status-current-style 'fg=colour232,bg=colour81,bold'
setw -g window-status-current-format '#[fg=colour232,bg=colour81,bold] #I:#W '
setw -g window-status-separator ''
setw -g window-status-activity-style 'fg=colour208,bg=colour234,bold'
setw -g window-status-bell-style 'fg=colour203,bg=colour234,bold'

# Per-pane footer (native formats only — cheap, scales with pane count).
set -g pane-border-status bottom
set -g pane-border-format ' #{?pane_active,>, }#{pane_index} #{pane_current_command} #{b:pane_current_path} '
set -g pane-border-style 'fg=colour238,bg=colour234'
set -g pane-active-border-style 'fg=colour81,bg=colour234,bold'

# Message / command line
set -g message-style 'bg=colour81,fg=colour232,bold'
set -g message-command-style 'bg=colour208,fg=colour232,bold'
