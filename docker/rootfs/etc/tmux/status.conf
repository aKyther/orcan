# Status bar — two rows at bottom (tmux 3.2+):
#   row 0 (above) = window tabs, centred
#   row 1 (edge)  = workspace (left) + metrics (right)
# Keep #(scripts) only on the global status line — never in pane-border-format.
#
# Palette: dark navy / near-black / subtle cyan (truecolor; ttyd + desktop).
# Image ships tmux 3.6a; gated blocks keep reloads safe on older servers.

set -g status 2
set -g status-position bottom
set -g status-justify centre
set -g status-interval 5

set -g status-style 'bg=#0d1520,fg=#94a3b8'
set -g status-left-length 48
set -g status-right-length 120

set -g status-left '#( /etc/tmux/scripts/status-left.sh )'
set -g status-right '#( /etc/tmux/scripts/status-right.sh )'

# Row 0: centred window tabs.
set -g status-format[0] '#[bg=#111827,list=on align=centre]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_bell_flag},#{!=:#{window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#{T:window-status-format}#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_bell_flag},#{!=:#{window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#{T:window-status-current-format}#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}'

# Row 1: identity + metrics.
set -g status-format[1] '#[align=left range=left #{E:status-left-style}]#{T;=/#{status-left-length}:status-left}#[norange default]#[align=right range=right #{E:status-right-style}]#{T;=/#{status-right-length}:status-right}#[norange default]'

# Tabs — quiet inactive, cyan pill when focused. No Nerd Font.
setw -g window-status-style 'fg=#64748b,bg=#111827'
setw -g window-status-format '#[fg=#334155,bg=#111827] #I #[fg=#64748b]#W '
setw -g window-status-current-style 'fg=#0a0e17,bg=#5eead4,bold'
setw -g window-status-current-format '#[fg=#0a0e17,bg=#5eead4,bold] #I #W '
setw -g window-status-separator '#[fg=#1e293b,bg=#111827]│'
setw -g window-status-activity-style 'fg=#fbbf24,bg=#111827,bold'
setw -g window-status-bell-style 'fg=#f87171,bg=#111827,bold'

# Active pane pops; inactive sinks (soft gap feel with spaces borders).
set -g window-style 'fg=#64748b,bg=#070b12'
set -g window-active-style 'fg=#c8d3e0,bg=#0a0e17'

# Pane title strip on top; clock + cpu/mem live here now, right-aligned
# (moved off status-right — pane-border-format supports #[align=right] since
# it renders through the same style/format engine as status-format). cpu/mem
# need a real read (/proc, free), not just strftime, so — unlike the clock —
# they go through a dedicated script (scripts/pane-border-right.sh), same
# pattern as status-left.sh/status-right.sh, rather than an inline #(...).
set -g pane-border-status top
set -g pane-border-format ' #[fg=#334155]#{?pane_active,#[fg=#5eead4 bold]› ,  }#[fg=#{?pane_active,#e2e8f0,#64748b}]#{pane_index} #[fg=#334155]│ #[fg=#{?pane_active,#67e8f9,#475569}]#{pane_current_command} #[fg=#334155]│ #[fg=#{?pane_active,#94a3b8,#475569}]#{b:pane_current_path} #[align=right]#( /etc/tmux/scripts/pane-border-right.sh ) #[fg=#334155]│ #[fg=#a5f3fc,bold]%H:%M '
set -g pane-border-style 'fg=#1e293b,bg=#070b12'
set -g pane-active-border-style 'fg=#5eead4,bg=#0a0e17,bold'
set -g pane-border-indicators both

%if #{>=:#{version},3.6}
setw -g pane-border-lines spaces
%else
setw -g pane-border-lines heavy
%endif

%if #{>=:#{version},3.5}
setw -g pane-scrollbars modal
setw -g pane-scrollbars-position right
setw -g pane-scrollbars-style 'bg=#0d1520,fg=#5eead4,width=1,pad=0'
%endif

# Menus / popups (session picker, URL pick) — need tmux 3.4+ style options.
%if #{>=:#{version},3.4}
set -g menu-style 'bg=#0d1520,fg=#c8d3e0'
set -g menu-selected-style 'bg=#5eead4,fg=#0a0e17,bold'
set -g menu-border-style 'fg=#334155,bg=#0d1520'
set -g popup-style 'bg=#0d1520,fg=#c8d3e0'
set -g popup-border-style 'fg=#5eead4,bg=#0d1520'
set -g popup-border-lines rounded
%endif

# Message / command / copy / clock
set -g message-style 'bg=#5eead4,fg=#0a0e17,bold'
set -g message-command-style 'bg=#fbbf24,fg=#0a0e17,bold'
set -g mode-style 'bg=#164e63,fg=#e0f2fe'
set -g copy-mode-match-style 'bg=#0e7490,fg=#e0f2fe'
set -g copy-mode-current-match-style 'bg=#5eead4,fg=#0a0e17,bold'
set -g display-panes-colour '#334155'
set -g display-panes-active-colour '#5eead4'
set -g clock-mode-colour '#5eead4'
set -g clock-mode-style 24
