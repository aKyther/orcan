# Status bar — one row at bottom (tmux 3.2+): window tabs, centred.
#
# The identity+metrics row (workspace brief/AI usage/git branch/battery via
# status-left.sh/status-right.sh) that used to live here is gone: the
# cockpit's own top bar (rail icons + CPU/RAM/clock) and bottom bar
# (workspace/branch/tmux session/pending) now own that — showing it a
# second time in tmux's own status line would just be redundant chrome and
# a wasted row of real pane space. status-left.sh/status-right.sh/
# ai-usage.sh stay on disk (still directly tested — see
# tests/smoke/test-container.sh) even though nothing in tmux's own config
# invokes them anymore; a raw `tmux attach`/`orcan enter --tmux` user
# outside the cockpit will not see that info at all, a deliberate tradeoff.
#
# Palette: Warm Graphite / Amber (truecolor; ttyd + desktop). Tokens live in
# theme.conf, sourced by tmux.conf before this file.
# Image ships tmux 3.6a; gated blocks keep reloads safe on older servers.

# "on" not "1": tmux's `status` option only accepts a bare numeric literal
# on a *fresh* load — `source-file`-ing "status 1" onto an already-running
# session (prefix r's live reload) fails with "unknown value: 1", even
# though "1" and "on" resolve to the exact same thing. "on" works both ways.
set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-interval 5

set -g status-style 'bg=#201d19,fg=#9a8f80'

# Centred window tabs. Keep tmux's native bell/activity wrappers here: values
# nested inside a `#[fg=…]` style are not expanded reliably by the `#{T:…}`
# pass, which turns the style into `fg=` and hides the entire tab list.
set -g status-format[0] '#[bg=#201d19,list=on align=centre]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_bell_flag},#{!=:#{window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#{T:window-status-format}#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_bell_flag},#{!=:#{window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#{T:window-status-current-format}#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}'

# Tabs stay neutral: a tiny native-state marker carries the status rather
# than painting every agent tab a different hue. bell = error, unread output
# = completed/activity, otherwise idle. Explicit running state remains a
# Cockpit process cue; tmux has no reliable model-state signal to invent.
setw -g window-status-style 'fg=#736a5e,bg=#201d19'
setw -g window-status-format '● #[fg=#9a8f80]#I #W'
setw -g window-status-current-style 'fg=#736a5e,bg=#2a251f'
setw -g window-status-current-format '● #[fg=#f5c988]#I #W'
setw -g window-status-separator '#[bg=#201d19]   '
setw -g window-status-activity-style 'fg=#7a9b8e,bg=#201d19'
setw -g window-status-bell-style 'fg=#e06c75,bg=#201d19'

# Active pane pops; inactive sinks (soft gap feel with spaces borders).
set -g window-style 'fg=#9a8f80,bg=#171512'
set -g window-active-style 'fg=#f0e9e0,bg=#171512'

# Pane title strip on top: which pane is active, its live label, its cwd —
# genuinely pane-specific info with no cockpit equivalent. clock + cpu/mem
# used to live here too (right-aligned, via scripts/pane-border-right.sh)
# but that's exactly the system-level info the cockpit's own top bar now
# owns — dropped here rather than shown twice. pane-border-right.sh stays
# on disk (still required/shellchecked — see scripts/repository/validate.sh)
# even though this format string no longer calls it.
#
# Window tabs: native #{pane_current_command} — cheap and fired often (every
# child process an agent spawns triggers the rename check).
setw -g automatic-rename-format '#{pane_current_command}'
# Pane border strip: pane-label.sh resolves "node" → "claude" via /proc, but
# gets command + pid from native format vars so it never calls back into
# `tmux` (that shell-out per redraw lagged input in busy agent panes).
set -g pane-border-status top
set -g pane-border-format ' #[fg=#{?pane_active,#{@orcan_accent},#{@orcan_text_disabled}}]#{?pane_active,› ,  }#[fg=#{?pane_active,#{@orcan_text_primary},#{@orcan_text_muted}}]#(/etc/tmux/scripts/pane-label.sh #{pane_current_command} #{pane_pid}) #[fg=#{@orcan_text_disabled}]· #[fg=#{?pane_active,#{@orcan_text_muted},#{@orcan_text_disabled}}]#{b:pane_current_path} '
set -g pane-border-style 'fg=#292420,bg=#171512'
set -g pane-active-border-style 'fg=#332e28,bg=#171512'
set -g pane-border-indicators both

%if #{>=:#{version},3.6}
setw -g pane-border-lines spaces
%else
setw -g pane-border-lines heavy
%endif

%if #{>=:#{version},3.5}
setw -g pane-scrollbars modal
setw -g pane-scrollbars-position right
setw -g pane-scrollbars-style 'bg=#201d19,fg=#9a8f80,width=1,pad=0'
%endif

# Menus / popups (session picker, URL pick) — need tmux 3.4+ style options.
%if #{>=:#{version},3.4}
set -g menu-style 'bg=#201d19,fg=#f0e9e0'
set -g menu-selected-style 'bg=#2a251f,fg=#f5c988'
set -g menu-border-style 'fg=#332e28,bg=#201d19'
set -g popup-style 'bg=#201d19,fg=#f0e9e0'
set -g popup-border-style 'fg=#332e28,bg=#201d19'
set -g popup-border-lines rounded
%endif

# Message / command / copy / clock
set -g message-style 'bg=#2a251f,fg=#f0e9e0'
set -g message-command-style 'bg=#e8b76c,fg=#171512'
set -g mode-style 'bg=#2a251f,fg=#f0e9e0'
set -g copy-mode-match-style 'bg=#332e28,fg=#f0e9e0'
set -g copy-mode-current-match-style 'bg=#e8b76c,fg=#171512'
set -g display-panes-colour '#5c554c'
set -g display-panes-active-colour '#e8b76c'
set -g clock-mode-colour '#e8b76c'
set -g clock-mode-style 24
