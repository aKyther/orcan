# Status bar — two rows at top (tmux 3.2+):
#   row 0 = workspace (left) + metrics (right)
#   row 1 = window tabs (full width — never clipped by metrics)
# Keep #(scripts) only on the global status line — never in pane-border-format.

set -g status 2
set -g status-position top
set -g status-justify left
set -g status-interval 5

set -g status-style 'bg=colour234,fg=colour252'
set -g status-left-length 40
set -g status-right-length 120

set -g status-left '#( /etc/tmux/scripts/status-left.sh )'
set -g status-right '#( /etc/tmux/scripts/status-right.sh )'

# Row 0: left + right only (no window list — tabs cannot be overlapped).
set -g status-format[0] '#[align=left range=left #{E:status-left-style}]#{T;=/#{status-left-length}:status-left}#[norange default]#[align=right range=right #{E:status-right-style}]#{T;=/#{status-right-length}:status-right}#[norange default]'

# Row 1: window tabs only (mouse-clickable ranges). Full width = tabs always visible.
set -g status-format[1] '#[bg=colour235,list=on align=left]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_bell_flag},#{!=:#{window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#{T:window-status-format}#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_bell_flag},#{!=:#{window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#{T:window-status-current-format}#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}'

# Window list = tabs. Plain ASCII — no Nerd Font / emoji required.
setw -g window-status-style 'fg=colour245,bg=colour235'
setw -g window-status-format '#[fg=colour240] #I#[fg=colour245]:#W '
setw -g window-status-current-style 'fg=colour232,bg=colour81,bold'
setw -g window-status-current-format '#[fg=colour232,bg=colour81,bold] #I:#W '
setw -g window-status-separator ''
setw -g window-status-activity-style 'fg=colour208,bg=colour235,bold'
setw -g window-status-bell-style 'fg=colour203,bg=colour235,bold'

# Per-pane footer (native formats only — cheap, scales with pane count).
set -g pane-border-status bottom
set -g pane-border-format ' #{?pane_active,>, }#{pane_index} #{pane_current_command} #{b:pane_current_path} '
set -g pane-border-style 'fg=colour238,bg=colour234'
set -g pane-active-border-style 'fg=colour81,bg=colour234,bold'

# Message / command line
set -g message-style 'bg=colour81,fg=colour232,bold'
set -g message-command-style 'bg=colour208,fg=colour232,bold'
