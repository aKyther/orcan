# cind tmux — main entry (ttyd-compatible, no terminal-specific features)
# Installed to /etc/tmux; ~/.tmux.conf sources this file.

run-shell 'mkdir -p "${HOME}/.cache/tmux" 2>/dev/null || true'

source-file /etc/tmux/options.conf
source-file /etc/tmux/keybindings.conf
source-file /etc/tmux/status.conf
