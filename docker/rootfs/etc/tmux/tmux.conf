# orcan tmux — main entry (ttyd-compatible, no terminal-specific features)
# Installed to /etc/tmux; ~/.tmux.conf sources this file.

run-shell 'mkdir -p "${HOME}/.cache/tmux" 2>/dev/null || true'

source-file /etc/tmux/options.conf
source-file /etc/tmux/keybindings.conf
source-file /etc/tmux/status.conf

# Right-click: drop tmux context menus so the event can reach ttyd/browser.
# These are tmux defaults when mouse is on — not defined earlier in this tree.
# Keep mouse on (pane focus, scroll, resize, status clicks). No empty bind-key.
unbind-key -T root MouseDown3Pane
unbind-key -T root MouseDown3Status
unbind-key -T root MouseDown3StatusLeft
unbind-key -T root M-MouseDown3Pane
