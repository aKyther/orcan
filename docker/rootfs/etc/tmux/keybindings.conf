# Keybindings — match host ~/.tmux.conf; orcan extras at the bottom.
#
# Embedded cockpit (agent-launcher / pty_terminal.py): local ``bind -n`` chords
# below must reach tmux as one xterm write — see cockpit/src/orcan_cockpit/pty_keys.py
# and tests/host/test_cockpit_pty_keys.py. Prefix binds (C-Space …) need no extra map.

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

unbind '"'
unbind %
bind - split-window -v
bind | split-window -h

# Reload (orcan)
bind r source-file /etc/tmux/tmux.conf \; display-message ' tmux config reloaded '

# Mouse toggle (local)
bind -n M-a set -g mouse on
bind -n M-q set -g mouse off

# Pane focus (local — no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Split panes (local — Ctrl+arrow, no prefix)
bind -n C-Down split-window -v
bind -n C-Up split-window -v -b
bind -n C-Right split-window -h
bind -n C-Left split-window -h -b

# Window prev/next (local)
bind -n C-M-Left previous-window
bind -n C-M-Right next-window

# Zoom pane (prefix + z — standard tmux; not Alt+Enter)
bind z resize-pane -Z

# New window (local)
bind -n M-c new-window

# Swap windows (local)
bind -n C-S-Left swap-window -t -1
bind -n C-S-Right swap-window -t +1

# Kill pane (local — with prefix)
bind x kill-pane

# Window select (local, Alt+digit — no prefix). NOTE: on Windows, a
# right-hand physical Alt key on an international layout (e.g. Polish) *is*
# AltGr, which Windows reports to the browser as a synthetic Ctrl+Alt chord.
# xterm.js deliberately treats that as "the user is composing an
# international character", not a terminal Alt-combo, and lets the plain
# character through instead of sending M-<digit> — so these M-1..9 binds can
# silently no-op (or type a stray digit) for those users even though nothing
# here is broken. Left Alt is unaffected. The prefixed `1`..`9` binds below
# are the layout-independent fallback — always reliable regardless of which
# Alt key or keyboard layout is in play.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t :$

# Window select (local, prefix + digit) — layout-independent fallback for
# the Alt+digit binds above.
bind 0 select-window -t :$
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# ── orcan extras (optional; prefix C-Space) ───────────────────────────────────
bind P run-shell '/etc/tmux/scripts/copy-path.sh'
# URLs: soft-wrap breaks click-to-open; this joins lines and copies (menu if many)
bind u run-shell '/etc/tmux/scripts/pick-url.sh'
# Sessions (one per orcan workspace) — not window tabs
bind s run-shell '/etc/tmux/scripts/session-switch.sh'
bind w run-shell '/etc/tmux/scripts/session-switch.sh'
# Windows in current session (IDE tab picker)
bind W choose-window -Z
bind I display-message ' #{session_name} · #{ORCAN_WORKSPACE_NAME} · #{ORCAN_PROJECT_PATH} '
# Shortcut reference — works even without the cockpit running (raw `tmux
# attach`, `orcan enter --tmux`): same manifest as the cockpit's own F1/?
# overlay (cockpit/src/orcan_cockpit/shortcuts.py), rendered standalone via
# shortcuts_cli.py so the two can never show different bindings.
bind ? display-popup -E '/opt/orcan-cockpit/venv/bin/python3 -m orcan_cockpit.shortcuts_cli'

# Copy-mode (vi): v select, y yank, mouse drag still works with set-clipboard.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
