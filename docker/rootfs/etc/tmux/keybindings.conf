# Keybindings — match host ~/.tmux.conf; cind extras at the bottom.

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

unbind '"'
unbind %
bind - split-window -v
bind | split-window -h

# Reload (cind)
bind r source-file /etc/tmux/tmux.conf \; display-message ' tmux config reloaded '

# Mouse toggle (local)
bind -n M-a set -g mouse on
bind -n M-q set -g mouse off

# Pane focus (local — no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Split panes (local — Ctrl+arrow, no prefix)
bind -n C-Down split-window -v
bind -n C-Up split-window -v -b
bind -n C-Right split-window -h
bind -n C-Left split-window -h -b

# Window prev/next (local)
bind -n C-M-Left previous-window
bind -n C-M-Right next-window

bind -n M-Enter resize-pane -Z

# New window (local)
bind -n M-c new-window

# Swap windows (local)
bind -n C-S-Left swap-window -t -1
bind -n C-S-Right swap-window -t +1

# Kill pane (local — with prefix)
bind x kill-pane

# Window select (local)
bind 0 select-window -t :$
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t :$

# ── cind extras (optional; prefix C-Space) ───────────────────────────────────
bind P run-shell '/etc/tmux/scripts/copy-path.sh'
bind s run-shell '/etc/tmux/scripts/session-switch.sh'
bind I display-message ' #{session_name} · #{CIND_WORKSPACE_NAME} · #{CIND_PROJECT_PATH} '
