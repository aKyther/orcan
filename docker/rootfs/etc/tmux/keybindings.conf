# Prefix: Ctrl+Space (documented in docs/tmux.md)

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file /etc/tmux/tmux.conf \; display-message ' tmux config reloaded '

# ── Panes: split in current directory ────────────────────────────────────────
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# ── Windows: create in current directory ─────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# ── Kill pane / window ───────────────────────────────────────────────────────
bind x kill-pane
bind X confirm kill-window

# ── Pane navigation (prefix) ─────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# ── Pane zoom / swap / rotate ────────────────────────────────────────────────
bind z resize-pane -Z
bind O swap-pane -U
bind R rotate-window

# ── Synchronized panes ───────────────────────────────────────────────────────
bind y set-window-option synchronize-panes \; display-message ' sync #{?synchronize-panes,on,off} '

# ── Copy mode (vi) ───────────────────────────────────────────────────────────
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind [ copy-mode

# ── Copy current path to tmux buffer ─────────────────────────────────────────
bind P run-shell '/etc/tmux/scripts/copy-path.sh'

# ── Window navigation ────────────────────────────────────────────────────────
bind -r n next-window
bind -r p previous-window
bind -r 1 select-window -t 1
bind -r 2 select-window -t 2
bind -r 3 select-window -t 3
bind -r 4 select-window -t 4
bind -r 5 select-window -t 5
bind -r 6 select-window -t 6
bind -r 7 select-window -t 7
bind -r 8 select-window -t 8
bind -r 9 select-window -t 9
bind 0 select-window -t :

# ── Session / project switch ─────────────────────────────────────────────────
bind s run-shell '/etc/tmux/scripts/session-switch.sh'
bind I display-message ' #{session_name} · #{CIND_PROJECT_NAME} · #{CIND_PROJECT_PATH} '

# ── Mouse-friendly extras (Alt may not work on phone — use launcher instead) ─
bind -n M-Enter resize-pane -Z
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
