# General behaviour — readable defaults for ttyd + xterm.js

set -g default-shell "${SHELL:-/bin/bash}"
set -g default-command "${SHELL:-/bin/bash}"

# Terminal: truecolor + UTF-8 (no Kitty/iTerm/OSC extensions)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB'
set -as terminal-overrides ',xterm-256color:Tc'
set -as terminal-overrides ',tmux-256color:RGB'
set -as terminal-overrides ',tmux-256color:Tc'
set -as terminal-overrides ',*256col*:RGB'
set -as terminal-overrides ',*256col*:Tc'

set -g escape-time 0
set -g focus-events on
set -g history-limit 500000
set -g display-time 2000
set -g status-interval 5
set -g repeat-time 400
set -g base-index 1
setw -g pane-base-index 1
setw -g aggressive-resize on

# Mouse (essential for ttyd / phone browsers)
set -g mouse on

# Window / pane numbering
set -g renumber-windows on
setw -g allow-rename on
set -g automatic-rename on
set -g automatic-rename-format '#{?pane_current_command,bash|sh|zsh,#{pane_current_command},#{b:pane_current_path}}'

# Titles (browser tab — ttyd may ignore)
set -g set-titles on
set -g set-titles-string '#{session_name} · #{window_name}'

# Vi copy mode
setw -g mode-keys vi
setw -g mode-style 'fg=colour231,bg=colour238'
# Copy stays in tmux buffer (ttyd has no desktop clipboard)
set -g copy-command ''

# Clipboard integration where available
set -s set-clipboard on

# Project context (set by cursor-tmux-attach)
set -g update-environment[0] 'CIND_PROJECT_NAME'
set -g update-environment[1] 'CIND_PROJECT_PATH'
set -g update-environment[2] 'PROJECT_DIR'

# Hooks: meaningful window names after changes
set-hook -g after-new-window 'run-shell "/etc/tmux/scripts/window-name.sh #{window_id}"'
set-hook -g window-renamed 'run-shell "/etc/tmux/scripts/window-name.sh #{window_id}"'
set-hook -g after-select-window 'run-shell "/etc/tmux/scripts/window-name.sh #{window_id}"'
