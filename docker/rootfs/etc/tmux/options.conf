# Behaviour — aligned with host ~/.tmux.conf (local is source of truth for UX).
# ttyd-safe: no bash ${VAR:-default} in set commands.

set -g default-shell /bin/zsh
set -g default-command /bin/zsh

set -g default-terminal "screen-256color"
set -sg escape-time 0
set -g focus-events on
set -g history-limit 100000
set -g display-time 2000
set -g status-interval 5
set -g base-index 1
setw -g pane-base-index 1
setw -g aggressive-resize on

set -g renumber-windows on
setw -g automatic-rename on
set -g allow-rename off

# Flag inactive windows with output (tab style via window-status-activity-style).
setw -g monitor-activity on
set -g visual-activity off
setw -g monitor-bell on
set -g visual-bell off

set -g set-titles on
set -g set-titles-string "#I:#W [#P:#{pane_current_command}]"

set -g status-keys vi
set -s set-clipboard on

# Mouse on by default (Alt+q to disable — same as local toggle)
set -g mouse on

# Do NOT put CIND_* / PROJECT_DIR in update-environment.
# Those are set per-session by cursor-tmux-*-attach. Copying them from the
# attaching client on every attach mixes workspace A mounts with workspace B
# labels when switching sessions or re-attaching.
