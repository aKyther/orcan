# Behaviour — aligned with host ~/.tmux.conf (local is source of truth for UX).
# ttyd-safe: no bash ${VAR:-default} in set commands.

set -g default-shell /bin/bash
set -g default-command /bin/bash

set -g default-terminal "screen-256color"
set -sg escape-time 0
set -g focus-events on
set -g history-limit 100000
set -g display-time 2000
set -g status-interval 5
set -g base-index 1
setw -g pane-base-index 1
setw -g aggressive-resize on

set -g renumber-windows on
setw -g automatic-rename on
set -g allow-rename off

set -g set-titles on
set -g set-titles-string "#I:#W [#P:#{pane_current_command}]"

set -g status-keys vi
set -s set-clipboard on

# Mouse off by default (toggle with Alt+a / Alt+q — same as local)
set -g mouse off

# Workspace context (cind attach scripts)
set -g update-environment[0] 'CIND_WORKSPACE_NAME'
set -g update-environment[1] 'CIND_WORKSPACE_ROOT'
set -g update-environment[2] 'CIND_PROJECT_NAME'
set -g update-environment[3] 'CIND_PROJECT_PATH'
set -g update-environment[4] 'PROJECT_DIR'
