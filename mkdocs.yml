site_name: cind
site_description: Context orchestrator for Cursor CLI and Claude Code in Docker
site_author: cind contributors

repo_url: https://github.com/example/cind
repo_name: example/cind
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Installation: installation.md
  - Docker: docker.md
  - Path parity: path-parity.md
  - Project launcher: launcher.md
  - tmux: tmux.md
  - Config (YAML + wizard): config.md
  - Architecture:
      - Context orchestration: architecture/context.md
      - Virtual workspace: architecture/workspace.md
  - Makefile: makefile.md
  - Cursor: cursor.md
  - Security: security.md
  - Development: development.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
