site_name: Orcan
site_description: Work-context orchestrator for Cursor CLI and Claude Code across many repositories in Docker
site_author: Orcan contributors
site_url: https://akyther.github.io/orcan/

repo_url: https://github.com/aKyther/orcan
repo_name: aKyther/orcan
edit_uri: edit/main/docs/

# Maintainer-only; not part of the published site nav
exclude_docs: |
  STYLE_GUIDE.md

copyright: >
  Copyright &copy; 2026 Orcan contributors ·
  <a href="https://github.com/aKyther/orcan/blob/main/LICENSE">MIT</a>

extra:
  orcan_version: "3.0.3"
  version:
    provider: mike
    default: latest
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aKyther/orcan
      name: GitHub
    - icon: fontawesome/solid/bug
      link: https://github.com/aKyther/orcan/issues
      name: Issues
    - icon: fontawesome/solid/tags
      link: https://github.com/aKyther/orcan/releases
      name: Releases
  homepage: https://akyther.github.io/orcan/
  tags:
    concept: concept
    guide: guide
    reference: reference
    develop: develop
    security: security

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/images/favicon.svg
  logo: assets/images/favicon.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    tag:
      concept: material/lightbulb-outline
      guide: material/book-open-outline
      reference: material/file-document-outline
      develop: material/hammer-wrench
      security: material/shield-outline
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    # navigation.instant is incompatible with the i18n language switcher
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - toc.follow

plugins:
  # lunr.js has no Polish stemmer; EN analyzer is used for both locales
  - search:
      lang: en
  - tags
  - mike:
      version_selector: true
      canonical_version: latest
  # i18n must be defined before git-revision-date-localized (locale on pages)
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: Orcan
        - locale: pl
          name: Polski
          build: true
          site_name: Orcan
          nav_translations:
            Home: Start
            Get started: Pierwsze kroki
            Understand: Zrozum
            Guides: Przewodniki
            Why Orcan?: Dlaczego Orcan?
            Core Ideas: Idee podstawowe
            Mental Model: Model mentalny
            Context Assertions: Context Assertions
            Agent inbox: Skrzynka agentów
            Runtime reconcile: Runtime reconcile
            Ideas: Idee
            Concepts: Koncepcje
            Workspaces: Workspaces
            Path parity: Path parity
            Change map: Mapa zmian
            Tags: Tagi
            Quick Start: Szybki start
            Installation: Instalacja
            Config guide: Przewodnik po konfiguracji
            Workflows: Przepływy pracy
            User dotfiles: Dotfiles użytkownika
            Terminal UI: Terminal UI
            Troubleshooting: Rozwiązywanie problemów
            Architecture: Architektura
            Reference: Referencja
            Configuration: Konfiguracja
            Config reference: Referencja konfiguracji
            Environment variables: Zmienne środowiskowe
            Makefile: Makefile
            Docker: Docker
            Cursor and Claude: Cursor i Claude
            Security: Bezpieczeństwo
            Host and container interface: Interfejs hosta i kontenera
            Development: Rozwój
            Develop: Rozwijaj
            Overview: Przegląd
            Testing: Testy
            Release process: Proces wydania
            AI context: Kontekst AI
            Deployment: Wdrożenie
            FAQ: FAQ
            Changelog: Changelog
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - assets/javascripts/mike-i18n.js
  - assets/javascripts/orcan-version.js
  - assets/javascripts/orcan-mermaid.js

extra_css:
  - assets/stylesheets/orcan.css

nav:
  - Home: index.md
  - Get started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Config guide: getting-started/configuration.md
  - Understand:
      - Why Orcan?: why-orcan.md
      - Ideas:
          - Core Ideas: ideas/core-ideas.md
          - Mental Model: ideas/mental-model.md
          - Context Assertions: ideas/context-assertions.md
          - Agent inbox: ideas/agent-inbox.md
          - Runtime reconcile: ideas/runtime-reconcile.md
      - Concepts:
          - Workspaces: concepts/workspaces.md
          - Path parity: concepts/path-parity.md
      - Change map: change-map.md
      - Tags: tags.md
  - Guides:
      - Workflows: guides/workflows.md
      - User dotfiles: guides/dotfiles.md
      - Terminal UI: guides/terminal-ui.md
      - Troubleshooting: guides/troubleshooting.md
      - Architecture: architecture.md
      - FAQ: faq.md
  - Reference:
      - CLI: reference/cli.md
      - Makefile (maintainers): reference/makefile.md
      - Docker: reference/docker.md
      - Config reference: reference/configuration.md
      - Environment variables: reference/environment.md
      - Cursor and Claude: reference/cursor-and-claude.md
      - Security: reference/security.md
      - Host and container interface: interface.md
  - Develop:
      - Overview: development/overview.md
      - Testing: development/testing.md
      - Release process: development/release.md
      - AI context: ai/project-context.md
      - Deployment: deployment.md
      - Changelog: changelog.md
