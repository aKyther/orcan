[package]
name = "orcan-studio"
version = "0.1.0"
description = "Native context composer for Orcan Sandbox"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orcan-studio-core = { path = "../../crates/orcan-studio-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
keyring = "3.6"
russh = "0.63"
