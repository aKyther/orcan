[package]
name = "orcan-studio"
version = "0.1.0"
description = "Native context composer for Orcan Sandbox"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orcan-studio-core = { path = "../../crates/orcan-studio-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
russh = "0.63"
tokio = { version = "1", features = ["process", "fs", "io-util", "macros"] }
tempfile = "3"
fs2 = "0.4"
