[project]
name = "orcan-executor"
version = "0.1.0"
description = "Local asynchronous Git commit verification with compact Redis Stream events"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6,<6",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
orcan-executor = "orcan_executor.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orcan_executor"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
