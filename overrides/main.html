{% extends "base.html" %}

{% block outdated %}
  You're not viewing the latest release documentation.
  <a href="{{ '../' ~ base_url }}">
    <strong>Switch to latest.</strong>
  </a>
{% endblock %}

{% block extrahead %}
  {{ super() }}
  {% set desc = page.meta.description if page and page.meta and page.meta.description else config.site_description %}
  <meta name="description" content="{{ desc }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title if page else config.site_name }} — {{ config.site_name }}">
  <meta property="og:description" content="{{ desc }}">
  <meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title if page else config.site_name }} — {{ config.site_name }}">
  <meta name="twitter:description" content="{{ desc }}">
{% endblock %}
