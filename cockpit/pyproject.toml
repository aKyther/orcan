[project]
name = "orcan-cockpit"
version = "3.0.1"
description = "Textual app behind agent-launcher: workspace picker + a live tmux session embedded in its own pty, with a side panel for pending Context Assertions."
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
    "pyte>=0.8.2",
    "libtmux>=0.62.0",
    "watchfiles>=1.2.0",
]

[project.scripts]
orcan-cockpit = "orcan_cockpit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orcan_cockpit"]
