name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 0'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI scope
    runs-on: ubuntu-latest
    outputs:
      studio: ${{ steps.scope.outputs.studio }}
      image: ${{ steps.scope.outputs.image }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select jobs from changed paths
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: |
          if [[ "$CI_EVENT" == workflow_dispatch || "$CI_EVENT" == schedule ]]; then
            python3 scripts/repository/ci_scope.py --full
          else
            python3 scripts/repository/ci_scope.py --base "$CI_BASE" --head "$CI_HEAD"
          fi

  studio:
    name: Orcan Studio (Linux build)
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/app/package-lock.json

      - name: Identify Rust cache toolchain
        id: rust-version
        shell: bash
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies (no bundles or incremental output)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            studio/target/debug/deps
            studio/target/debug/build
            studio/target/debug/.fingerprint
          key: studio-check-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('studio/Cargo.lock', 'studio/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            studio-check-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('studio/Cargo.lock', 'studio/**/Cargo.toml') }}-

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Test Studio transport core
        run: make studio-test

      - name: Build Studio user interface
        working-directory: studio/app
        run: |
          npm ci
          npm test
          npm run build

      - name: Test native Studio application
        run: cargo test --manifest-path studio/Cargo.toml -p orcan-studio

      - name: Cache the fixture browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: studio-browser-${{ runner.os }}-${{ runner.arch }}-playwright-1.55.0

      - name: Test Studio browser flows (fixture backend only)
        run: |
          npm install --no-save --no-package-lock --prefix .orcan-dev-ux/playwright-node @playwright/test@1.55.0
          .orcan-dev-ux/playwright-node/node_modules/.bin/playwright install chromium --with-deps
          make studio-test-browser

      - name: Keep only reusable dependency artifacts in Rust cache
        run: |
          cargo clean --manifest-path studio/Cargo.toml -p orcan-studio -p orcan-studio-core
          du -sh studio/target/debug/deps studio/target/debug/build

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The revision-date plugin needs history; otherwise docs-check fails in strict mode.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-test.txt

      - name: Install uv for host tests
        run: python -m pip install uv==0.12.23

      - name: Cache uv test dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: host-tests-${{ runner.os }}-py312-${{ hashFiles('requirements-test.txt') }}

      - name: Validate repository
        run: make validate

      - name: Python format
        run: uv run --no-project --with-requirements requirements-test.txt make format-check

      - name: Full host tests with Python coverage (one run)
        run: ORCAN_TEST_MODE=all make test-coverage

      - name: Check documentation
        run: make docs-check

  image-scan:
    name: Image vulnerability scan (Trivy)
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    # contents:read alone sets every other GITHUB_TOKEN scope to none.
    # trivy-action then cannot restore/save its DB cache (actions/cache)
    # or pull ghcr.io/aquasecurity/trivy-db (anonymous GHCR is rate-limited).
    # The job fails at "Scan image with Trivy" with exit 1 before a CVE table.
    permissions:
      contents: read
      actions: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image (local only, not published)
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -t orcan:ci-scan .

      # Pinned by commit SHA, not the @v0.36.0 tag: third-party Action tags
      # have been hijacked in the wild by pushing malicious code to an
      # existing tag (tj-actions/changed-files, CVE-2025-30066;
      # reviewdog/action-setup, CVE-2025-30154). A commit SHA can't be
      # silently moved the way a tag can. Bump deliberately — check
      # https://github.com/aquasecurity/trivy-action/releases first.
      - name: Scan image with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: orcan:ci-scan
          format: json
          output: trivy-report.json
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: "10m"
          exit-code: "1"

      - name: Trivy compact summary (B2)
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          report_path = Path("trivy-report.json")
          summary_path = Path("trivy-summary.md")

          lines = []
          lines.append("## Trivy compact summary")
          lines.append("")

          trivy_outcome = "${{ steps.trivy.outcome }}"
          lines.append(f"- Trivy step outcome: **{trivy_outcome}**")
          lines.append("- Policy: `severity=CRITICAL,HIGH`, `ignore-unfixed=true`")
          lines.append("")

          if not report_path.exists():
              lines.append("No `trivy-report.json` file was produced.")
              lines.append("")
              lines.append("### Next steps")
              lines.append("- Open the Trivy step log and check the first fatal error line.")
              lines.append("- If the step failed before report generation, re-run the workflow.")
          else:
              data = json.loads(report_path.read_text(encoding="utf-8"))
              counts = Counter()
              targets = 0
              fixed = 0
              unresolved = 0
              top = []

              for result in data.get("Results", []):
                  vulns = result.get("Vulnerabilities") or []
                  if not vulns:
                      continue
                  targets += 1
                  for v in vulns:
                      sev = (v.get("Severity") or "UNKNOWN").upper()
                      counts[sev] += 1
                      if v.get("FixedVersion"):
                          fixed += 1
                      else:
                          unresolved += 1
                      if len(top) < 10:
                          top.append(
                              (
                                  result.get("Target", "unknown"),
                                  v.get("PkgName", "unknown"),
                                  v.get("VulnerabilityID", "unknown"),
                                  sev,
                                  v.get("InstalledVersion", "-"),
                                  v.get("FixedVersion") or "-",
                              )
                          )

              total = sum(counts.values())
              lines.append("### Findings")
              lines.append(f"- Targets with findings: **{targets}**")
              lines.append(f"- Total vulnerabilities (HIGH+CRITICAL): **{total}**")
              lines.append(
                  f"- Severity split: CRITICAL **{counts['CRITICAL']}**, HIGH **{counts['HIGH']}**"
              )
              lines.append(f"- Fix available now: **{fixed}**")
              lines.append(f"- No fix yet: **{unresolved}**")
              lines.append("")

              if top:
                  lines.append("### First 10 vulnerabilities")
                  lines.append("| Target | Package | CVE | Severity | Installed | Fixed |")
                  lines.append("|---|---|---|---|---|---|")
                  for t, p, cve, sev, inst, fix in top:
                      lines.append(f"| `{t}` | `{p}` | `{cve}` | {sev} | `{inst}` | `{fix}` |")
                  lines.append("")

              lines.append("### Next steps")
              lines.append("- Group issues by source: base image, Go toolchain, Docker CLI, Node packages.")
              lines.append("- Update components with fixes first (`FixedVersion` is not empty).")
              lines.append("- Keep `ignore-unfixed=true` so only actionable CVEs fail the Trivy step.")
              lines.append("- If noise is still too high, narrow scope (`scanners`, `skip-dirs`) before changing severity policy.")

          summary = "\n".join(lines) + "\n"
          summary_path.write_text(summary, encoding="utf-8")

          with open(Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]), "a", encoding="utf-8") as f:
              f.write(summary)
          PY

  docs-dev:
    name: Deploy docs (latest)
    needs: [checks, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    # Serialize with Release workflow (both push gh-pages)
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --force || echo "gh-pages not present yet"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Deploy mike alias "latest"
        env:
          DOCS_MIKE_PUSH: "1"
        run: ./scripts/repository/docs-mike.sh latest
