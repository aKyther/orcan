name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Validate repository
        run: make validate

      - name: Host tests
        run: make test-host

      - name: Check documentation
        run: make docs-check

  docs-dev:
    name: Deploy docs (dev)
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize with Release workflow (both push gh-pages)
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --force || echo "gh-pages not present yet"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Deploy mike alias "dev"
        env:
          DOCS_MIKE_PUSH: "1"
        run: ./scripts/repository/docs-mike.sh dev
