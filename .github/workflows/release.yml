name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to validate/release (e.g. v0.1.0)"
        required: true
      expected_sha:
        description: "Exact commit SHA selected for readiness"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, docs, GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialize with CI docs-dev (both push gh-pages)
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "$actual" == "$EXPECTED_SHA" ]]
          git checkout --detach "$EXPECTED_SHA"
          file_v="$(tr -d '[:space:]' < VERSION)"
          [[ "$RELEASE_TAG" == "v${file_v}" ]]
          ./scripts/repository/release.sh check
          echo "version=${file_v}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --force || echo "gh-pages not present yet"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Validate repository
        run: make validate

      - name: Install uv for host tests
        run: python -m pip install uv==0.12.23

      - name: Host tests
        run: make test-host

      - name: Check documentation
        run: make docs-check

      - name: Verify remote tag remains pinned
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" | awk 'NR==1 {sha=$1} /\^\{\}$/ {sha=$1} END {print sha}')"
          [[ "$actual" == "$EXPECTED_SHA" ]]

      - name: Deploy versioned docs (mike)
        env:
          DOCS_MIKE_PUSH: "1"
        run: ./scripts/repository/docs-mike.sh release "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Orcan ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            Ready commit: `${{ inputs.expected_sha }}`

            ## Install / upgrade

            Orcan is distributed as a **CLI**. Install, then init / build / up:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/aKyther/orcan/v${{ steps.ver.outputs.version }}/install.sh | bash
            orcan doctor
            orcan init /absolute/path/to/your/repo
            orcan build --all-agents
            orcan up
            ```

            Open `http://localhost:7681`. After config edits: `orcan sync && orcan down && orcan up`.

            Already installed? `orcan update`, then checkout `v${{ steps.ver.outputs.version }}` in the install clone (`~/.local/share/orcan`) and run `orcan build` if the image changed.

            ## Docs

            - Latest: https://akyther.github.io/orcan/latest/
            - This version: https://akyther.github.io/orcan/${{ steps.ver.outputs.version }}/

            See [CHANGELOG.md](https://github.com/aKyther/orcan/blob/v${{ steps.ver.outputs.version }}/CHANGELOG.md).
