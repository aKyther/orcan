name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to validate/release (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, docs, GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialize with CI docs-dev (both push gh-pages)
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          file_v="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${file_v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be SemVer X.Y.Z (got: ${file_v})" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
            git checkout "refs/tags/${tag}"
            file_v="$(tr -d '[:space:]' < VERSION)"
          fi

          [[ "${tag}" == v* ]] || { echo "tag must start with v (got: ${tag})" >&2; exit 1; }
          tag_v="${tag#v}"
          if [[ "${tag_v}" != "${file_v}" ]]; then
            echo "Tag ${tag} does not match VERSION file (${file_v})" >&2
            exit 1
          fi

          echo "version=${tag_v}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${tag} → ${tag_v}"

          # Cosmetic label only (release title + extra docs alias) — CalVer
          # never replaces vX.Y.Z as the source of truth (orcan update/
          # downgrade and this workflow's trigger both still key off it).
          # `make release` drops a "## YY.Q — DATE" divider in CHANGELOG.md
          # directly above this version's "## [X.Y.Z]" section; read it
          # back from the tagged tree. Empty for pre-CalVer tags.
          calver="$(awk -v target="## [${tag_v}]" '
              /^## [0-9][0-9]\.[0-9]+ /{cv=$2}
              index($0, target) == 1 {print cv; exit}
          ' CHANGELOG.md)"
          echo "calver=${calver}" >> "$GITHUB_OUTPUT"
          [[ -n "${calver}" ]] && echo "CalVer label: ${calver}" || echo "No CalVer label for ${tag} (pre-scheme tag)"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --force || echo "gh-pages not present yet"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Validate repository
        run: make validate

      - name: Host tests
        run: make test-host

      - name: Check documentation
        run: make docs-check

      - name: Deploy versioned docs (mike)
        env:
          DOCS_MIKE_PUSH: "1"
        run: ./scripts/repository/docs-mike.sh release "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.calver }}"

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.calver && format('Orcan {0} (v{1})', steps.ver.outputs.calver, steps.ver.outputs.version) || format('Orcan v{0}', steps.ver.outputs.version) }}
          generate_release_notes: true
          body: |
            ## Install / upgrade

            Orcan is distributed as a **CLI**. Install, then init / build / up:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/aKyther/orcan/v${{ steps.ver.outputs.version }}/install.sh | bash
            orcan doctor
            orcan init /absolute/path/to/your/repo
            orcan build
            orcan up
            ```

            Open `http://localhost:7681`. After config edits: `orcan sync && orcan down && orcan up`.

            Already installed? `orcan update`, then checkout `v${{ steps.ver.outputs.version }}` in the install clone (`~/.local/share/orcan`) and run `orcan build` if the image changed.

            ## Docs

            - Latest: https://akyther.github.io/orcan/latest/
            - This version: https://akyther.github.io/orcan/${{ steps.ver.outputs.version }}/
            - Polish: https://akyther.github.io/orcan/${{ steps.ver.outputs.version }}/pl/

            See [CHANGELOG.md](https://github.com/aKyther/orcan/blob/v${{ steps.ver.outputs.version }}/CHANGELOG.md).
