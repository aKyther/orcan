name: Orcan Studio bundles

on:
  workflow_dispatch:
  push:
    tags: ["studio-v*"]

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
          - name: macOS application
            os: macos-latest
          - name: Linux package
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/app/package-lock.json
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install UI dependencies
        working-directory: studio/app
        run: npm ci
      - name: Build native bundle
        working-directory: studio/app
        run: npm run tauri build
      - name: Upload bundle
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: orcan-studio-${{ runner.os }}
          path: studio/app/src-tauri/target/release/bundle/
          if-no-files-found: error
