name: Orcan Studio bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
          - name: macOS application
            os: macos-latest
          - name: Linux package
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/app/package-lock.json
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install UI dependencies
        working-directory: studio/app
        run: npm ci
      - name: Identify Rust cache toolchain
        id: rust-version
        shell: bash
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust dependencies (no bundles or incremental output)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            studio/target/release/deps
            studio/target/release/build
            studio/target/release/.fingerprint
          key: studio-bundle-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('studio/Cargo.lock', 'studio/**/Cargo.toml', 'studio/app/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            studio-bundle-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('studio/Cargo.lock', 'studio/**/Cargo.toml', 'studio/app/package-lock.json') }}-
      - name: Build native bundle
        working-directory: studio/app
        run: npm run tauri build
      - name: Upload bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: orcan-studio-${{ runner.os }}
          path: studio/target/release/bundle/
          if-no-files-found: error
